<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Suara Warga — Draft Interaktif</title>
<style>
:root{--ink:#173b37;--muted:#637771;--teal:#12675b;--line:#dce6e1;--paper:#fff;--wash:#f3f6f3;--gold:#e9c879}*{box-sizing:border-box}body{margin:0;background:#e8eeea;color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;font-size:16px}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d6aa44;outline-offset:3px}button{min-height:44px}button:disabled{cursor:not-allowed;opacity:.45}.demo{padding:12px 24px;background:#173b37;color:#fff;display:flex;gap:16px;align-items:center;justify-content:space-between;font-size:12px}.demo strong{color:#f1d795;letter-spacing:1.4px;font-size:11px}.demo span{opacity:.85}.roles{display:flex;gap:5px;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}.role{background:transparent;color:var(--muted);border:0;border-radius:8px;padding:0 15px;font-size:13px}.role.active{background:var(--ink);color:white}.shell{max-width:1120px;margin:24px auto;display:grid;grid-template-columns:330px 1fr;background:white;border:1px solid #d5e0da;border-radius:20px;overflow:hidden;height:730px;max-height:calc(100dvh - 160px);min-height:520px;box-shadow:0 12px 48px #173b370c}.sidebar{background:#fbfcfa;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}.brand{padding:26px 24px 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--teal);text-transform:uppercase}.brand h1{font-size:25px;letter-spacing:-1px;margin:6px 0}.brand p{font-size:12px;color:var(--muted);margin:0}.identity{padding:20px 24px 12px;display:flex;align-items:center;justify-content:space-between}.identity strong{font-size:14px}.badge{font-size:10px;padding:5px 8px;border-radius:20px;background:#e6eee8;color:#355b4c}.new{margin:0 20px 20px;background:var(--teal);border:0;border-radius:10px;color:white;font-weight:600;padding:12px 14px}.list-label{padding:4px 24px 12px;color:var(--muted);font-size:10px;letter-spacing:1.4px;font-weight:700}.thread{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;text-align:left;padding:18px 24px;width:100%;display:block}.thread.selected{background:#eaf2ed;box-shadow:inset 3px 0 var(--teal)}.thread strong{font-size:14px;display:block}.thread small{display:block;color:var(--muted);font-size:12px;margin-top:7px;line-height:1.5}.thread .meta{font-size:10px;color:var(--teal);margin-top:8px}.sidefoot{margin-top:auto;padding:20px 24px;color:var(--muted);font-size:11px;line-height:1.65}.main{min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}.home{overflow:auto;padding:38px;flex:1}.intro{font-size:12px;color:var(--teal);font-weight:600}.home h2{font-size:36px;line-height:1.15;letter-spacing:-1.5px;max-width:420px;margin:14px 0}.home .lede{font-size:14px;line-height:1.7;color:var(--muted);max-width:430px;margin-bottom:30px}.step{font-size:12px;font-weight:700;margin:22px 0 12px}.recipients{display:grid;grid-template-columns:1fr 1fr;gap:12px}.recipient{border:1px solid var(--line);border-radius:13px;background:#fff;padding:20px 16px;text-align:left;color:var(--ink)}.recipient.selected{border:2px solid var(--teal);padding:19px 15px;background:#f1f7f3}.avatar{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;background:#e4ede7;color:var(--teal);font-weight:700;font-size:13px;flex-shrink:0}.recipient strong{display:block;font-size:14px;margin:14px 0 7px}.recipient small{color:var(--muted);font-size:11px}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 12px;color:var(--muted);font-size:12px}.cat.selected{color:var(--teal);background:#eaf2ed;border-color:var(--teal)}.privacy{margin:22px 0;color:var(--muted);font-size:12px;line-height:1.7}.primary{background:var(--teal);border:0;border-radius:10px;color:#fff;padding:13px 18px;font-weight:600}.wide{width:100%}.secondary{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:10px 13px}.head{padding:19px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);background:white}.head .details{flex:1;min-width:0}.head h2{font-size:16px;margin:0 0 5px}.head small{font-size:11px;color:var(--muted)}.back{border:0;background:transparent;font-size:22px;padding:0 8px;display:none;color:var(--ink)}.head-action{font-size:12px}.notice{padding:11px 24px;background:#f7f8f3;font-size:11px;line-height:1.6;color:#66745d;border-bottom:1px solid var(--line)}.messages{padding:24px;overflow:auto;flex:1;background:#f2f5ef;display:flex;flex-direction:column;gap:14px}.date{text-align:center;font-size:10px;color:var(--muted);letter-spacing:.6px;margin:0 0 7px}.bubble{align-self:flex-start;max-width:83%;padding:13px 16px;border-radius:0 14px 14px 14px;background:white;border:1px solid #e1e8df;font-size:14px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#dceee1;border-color:#d1e4d6;border-radius:14px 0 14px 14px}.sender{font-size:10px;font-weight:700;color:var(--teal);display:block;margin-bottom:5px;letter-spacing:.2px}.time{display:block;font-size:10px;color:#718277;text-align:right;margin-top:6px}.event{text-align:center;font-size:11px;line-height:1.6;color:var(--muted);padding:6px 20px}.note{padding:12px 15px;background:#fcf3d9;border:1px solid #ebdfba;border-radius:9px;color:#715c28;font-size:12px;line-height:1.6}.note strong{display:block;font-size:10px;margin-bottom:5px;letter-spacing:.5px}.compose{background:white;border-top:1px solid var(--line);padding:14px 20px calc(12px + env(safe-area-inset-bottom))}.compose-row{display:flex;gap:10px;align-items:flex-end}.compose textarea{resize:none;min-height:48px;max-height:150px;flex:1;width:0;border:1px solid var(--line);border-radius:11px;padding:13px;font-size:14px;color:var(--ink);background:#fafbf8;line-height:1.5}.send{background:var(--teal);color:#fff;border:0;border-radius:10px;min-height:48px;padding:0 17px;font-size:13px;font-weight:600}.hint{font-size:10px;color:var(--muted);margin-top:8px}.readonly{padding:20px;text-align:center;background:#fafbf8;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.empty{padding:40px;color:var(--muted);line-height:1.7}.modal-cover{position:fixed;inset:0;background:#112f2bd0;z-index:5;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:16px;padding:26px;max-width:440px;width:100%}.modal h2{margin:0 0 12px;font-size:22px}.modal p{font-size:13px;color:var(--muted);line-height:1.7}.modal textarea,.modal input{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;margin:8px 0 18px;min-height:48px}.modal textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;justify-content:flex-end}.code{padding:14px;background:#f1f5ef;border-radius:9px;font-family:monospace;font-size:22px;text-align:center;letter-spacing:2px;margin:18px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:10px;z-index:9;font-size:13px;max-width:90%;text-align:center}.mobile-homebar{display:none}.footer{font-size:11px;color:var(--muted);text-align:center;padding:0 20px 20px}.hidden{display:none!important}@media(max-width:760px){.demo{padding:10px 14px;gap:8px}.demo span{font-size:10px;max-width:185px;text-align:right}.roles{padding:8px;gap:3px;justify-content:space-between}.role{font-size:11px;padding:0 9px}.shell{margin:0;border:0;border-radius:0;height:calc(100dvh - 105px);max-height:none;min-height:420px;display:block;box-shadow:none}.sidebar{height:100%;border:0}.main{height:100%}.shell:not(.chat-open) .main{display:none}.shell.chat-open .sidebar{display:none}.shell.chat-open .main{display:flex}.brand{padding:25px 22px}.brand h1{font-size:30px}.back{display:block}.home{padding:25px 22px}.home h2{font-size:32px}.head{padding:12px 12px;gap:8px}.head h2{font-size:14px}.head-action{font-size:11px;padding:8px;min-height:44px}.head .avatar{width:34px;height:34px;font-size:11px}.messages{padding:18px 14px}.bubble{max-width:88%;font-size:15px}.notice{padding:10px 16px}.compose{padding:12px 12px calc(10px + env(safe-area-inset-bottom))}.footer{display:none}.mobile-homebar{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}.sidefoot{font-size:12px}.recipient{padding:15px 12px}.recipient.selected{padding:14px 11px}}
</style></head><body>
<div class="demo"><strong>DRAFT / SUARA WARGA</strong><span>DEMO — Jangan masukkan maklumat sebenar · Reset apabila refresh</span></div>
<nav class="roles" aria-label="Tukar peranan untuk demo"><button class="role active" data-role="staf">Staf</button><button class="role" data-role="pengarah">Pengarah</button><button class="role" data-role="timbalan">Timbalan</button><button class="role" data-role="pentadbir">Pentadbir</button></nav>
<div class="shell" id="shell"><aside class="sidebar" id="sidebar"></aside><main class="main" id="main"></main></div><div class="footer">Prototaip UI sahaja. Kod staf, login, penghantaran sebenar dan kawalan akses backend belum disambungkan.</div><div id="overlay"></div><div id="toast" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={staf:'Staf',pengarah:'Pengarah',timbalan:'Timbalan Pengarah',pentadbir:'Pentadbir'};
const categories=['Luahan','Aduan tidak rasmi','Cadangan penambahbaikan'];
let role='staf',selected=null,recipient='pengarah',category=0,newCount=0,toastTimer;
let threads=[{id:'contoh-timbalan',code:'DEMO-TIMBALAN',to:'timbalan',cat:0,forwarded:false,note:'',messages:[{by:'staf',text:'Saya ingin berkongsi tentang keseimbangan beban kerja dan masa rehat. Boleh kita pertimbangkan ruang untuk staf memberi maklum balas secara berkala?'},{by:'timbalan',text:'Terima kasih kerana berkongsi. Apakah bentuk sesi maklum balas yang anda rasa paling sesuai dan selesa untuk staf?'},{by:'staf',text:'Mungkin sesi ringkas secara berkala, dengan pilihan untuk menghantar pandangan secara anonim.'}]},{id:'contoh-pengarah',code:'DEMO-PENGARAH',to:'pengarah',cat:2,forwarded:false,note:'',messages:[{by:'staf',text:'Saya cadangkan satu ruang perkongsian idea antara unit untuk penambahbaikan perkhidmatan hospital.'},{by:'pengarah',text:'Terima kasih atas cadangan ini. Boleh kongsikan bagaimana ruang perkongsian itu boleh dilaksanakan?'}]}];
function allowed(t){return role==='staf'||role==='pentadbir'||(role==='pengarah'&&(t.to==='pengarah'||t.forwarded))||(role==='timbalan'&&t.to==='timbalan')}
function current(){return threads.find(t=>t.id===selected)}
function label(t){return role==='staf'?names[t.to]:'Perbualan '+(threads.indexOf(t)+1).toString().padStart(2,'0')}
function notify(text){clearTimeout(toastTimer);$('#toast').innerHTML='<div class="toast">'+esc(text)+'</div>';toastTimer=setTimeout(()=>$('#toast').innerHTML='',3500)}
function renderSidebar(){const ts=threads.filter(allowed);$('#sidebar').innerHTML='<div class="brand"><div class="eyebrow">Hospital Hulu Terengganu · Draft</div><h1>Suara Warga<span style="color:#ad8c45">.</span></h1><p>Ruang mendengar. Ruang bersuara.</p></div><div class="identity"><strong>'+names[role]+'</strong><span class="badge">'+(role==='staf'?'Tanpa nama':role==='pentadbir'?'Baca sahaja':'Baca & balas')+'</span></div>'+(role==='staf'?'<button class="new" id="newChat">＋ Mulakan perbualan</button><button class="secondary" style="margin:0 20px 22px" id="restore">Buka dengan kod rahsia</button>':'')+'<div class="list-label">'+(role==='staf'?'PERBUALAN ANDA · CONTOH':'PETI MASUK · DATA DEMO')+'</div>'+ts.map(t=>'<button class="thread '+(selected===t.id?'selected':'')+'" data-thread="'+t.id+'"><strong>'+esc(label(t))+'</strong><small>'+String.fromCharCode(65+t.cat)+'. '+esc(categories[t.cat])+'</small><small>'+esc(t.messages.at(-1)?.text.slice(0,72)||'Belum ada mesej')+'</small><div class="meta">'+(t.forwarded?'Dimajukan kepada Pengarah':'Saluran '+names[t.to])+'</div></button>').join('')+'<div class="sidefoot">'+(role==='staf'?'Nama, telefon dan e-mel tidak diminta.<br>Jangan sertakan identiti atau maklumat pesakit.':'Akses dipaparkan mengikut peranan demo.<br>Akaun sebenar belum disambungkan.')+'</div>';document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>{selected=b.dataset.thread;$('#shell').classList.add('chat-open');render()});if($('#newChat'))$('#newChat').onclick=()=>{selected=null;$('#shell').classList.add('chat-open');render()};if($('#restore'))$('#restore').onclick=restoreModal}
function renderHome(){if(role!=='staf'){$('#main').innerHTML='<div class="empty"><div class="eyebrow">Peti masuk</div><h2>Pilih satu perbualan.</h2>Mesej yang boleh diakses dipaparkan di sebelah kiri.'+(role==='pentadbir'?'<p>Akaun ini hanya boleh membaca. Tiada fungsi membalas atau memajukan mesej.</p>':'')+'</div>';return}$('#main').innerHTML='<div class="mobile-homebar"><button class="back" id="back">‹</button>Perbualan baharu</div><div class="home"><div class="intro">KHAS UNTUK WARGA HOSPITAL</div><h2>Ada yang ingin<br>anda suarakan?</h2><p class="lede">Luahkan dengan tenang. Kongsikan pandangan anda terus kepada kepimpinan hospital, tanpa perlu memperkenalkan diri.</p><div class="step">01 &nbsp; Kepada siapa?</div><div class="recipients">'+['pengarah','timbalan'].map(r=>'<button class="recipient '+(recipient===r?'selected':'')+'" data-recipient="'+r+'" aria-pressed="'+(recipient===r)+'"><span class="avatar">'+(r==='pengarah'?'P':'TP')+'</span><strong>'+names[r]+'</strong><small>Pilih saluran ini '+(recipient===r?'✓':'→')+'</small></button>').join('')+'</div><div class="step">02 &nbsp; Apa yang ingin dikongsikan?</div><div class="cats">'+categories.map((c,i)=>'<button class="cat '+(category===i?'selected':'')+'" data-cat="'+i+'" aria-pressed="'+(category===i)+'">'+String.fromCharCode(65+i)+'. '+c+'</button>').join('')+'</div><p class="privacy"><strong>Siapa boleh baca?</strong> '+(recipient==='pengarah'?'Pengarah dan Pentadbir sistem.':'Timbalan Pengarah dan Pentadbir sistem. Pengarah mendapat akses jika perbualan dimajukan.')+'<br>Ini bukan saluran kecemasan atau pengganti aduan rasmi.</p><button class="primary wide" id="start">Mulakan chat &nbsp; →</button><p class="hint">Demo: tiada kod staf atau maklumat peribadi diperlukan.</p></div>';document.querySelectorAll('[data-recipient]').forEach(b=>b.onclick=()=>{recipient=b.dataset.recipient;renderHome()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=Number(b.dataset.cat);renderHome()});if($('#back'))$('#back').onclick=goBack;$('#start').onclick=()=>{newCount++;let a=new Uint32Array(3);crypto.getRandomValues(a);const code=Array.from(a,x=>x.toString(16).padStart(8,'0')).join('-').toUpperCase();let t={id:'new-'+newCount,code,to:recipient,cat:category,forwarded:false,note:'',messages:[]};threads.unshift(t);selected=t.id;render();codeModal(t)}}
function goBack(){$('#shell').classList.remove('chat-open')}
function renderChat(t){let canReply=role!=='pentadbir'&&allowed(t);let access=t.to==='pengarah'?'Pengarah dan Pentadbir':t.forwarded?'Timbalan Pengarah, Pengarah dan Pentadbir':'Timbalan Pengarah dan Pentadbir';$('#main').innerHTML='<header class="head"><button class="back" id="back" aria-label="Kembali">‹</button><span class="avatar">'+(t.to==='pengarah'?'P':'TP')+'</span><div class="details"><h2>'+esc(role==='staf'?names[t.to]:label(t))+'</h2><small>'+String.fromCharCode(65+t.cat)+'. '+categories[t.cat]+'</small></div>'+(role==='staf'?'<button class="secondary head-action" id="showCode">Kod rahsia</button>':role==='timbalan'&&!t.forwarded?'<button class="secondary head-action" id="forward">Majukan ↗</button>':'')+'</header><div class="notice">Boleh dibaca oleh '+access+'. Jangan kongsi maklumat pengenalan atau maklumat pesakit.</div><section class="messages" id="messages" aria-label="Mesej perbualan"><div class="date">PERBUALAN DEMO · BUKAN MESEJ SEBENAR</div>'+(!t.messages.length?'<div class="event">Ruang anda untuk bersuara.<br>Mulakan dengan satu mesej di bawah.</div>':'')+t.messages.map(m=>'<div class="bubble '+((role==='staf'?m.by==='staf':m.by===role)?'mine':'')+'"><span class="sender">'+(m.by==='staf'?'Staf · Tanpa nama':names[m.by])+'</span>'+esc(m.text)+'<span class="time">Demo'+(m.by==='staf'?' · Dihantar dalam pratonton':'')+'</span></div>').join('')+(t.forwarded?'<div class="event">Perbualan ini telah dimajukan kepada Pengarah Hospital.<br>Pengarah dan Timbalan kini boleh membaca dan membalas.</div>':'')+(t.forwarded&&role!=='staf'?'<div class="note"><strong>NOTA DALAMAN · TIMBALAN PENGARAH</strong>'+esc(t.note)+'<br><small>Tidak dipaparkan kepada staf.</small></div>':'')+'</section>'+(canReply?'<form class="compose" id="compose"><div class="compose-row"><textarea id="message" rows="2" maxlength="4000" aria-label="Taip mesej" placeholder="'+(role==='staf'?'Taip mesej anda…':'Balas sebagai '+names[role]+'…')+'"></textarea><button class="send" type="submit" id="send" disabled>Hantar ↑</button></div><div class="hint">'+(role==='staf'?'Enter untuk baris baharu · Simpan kod untuk buka semula chat.':'Balasan dilabel sebagai '+names[role]+'.')+'</div></form>':'<div class="readonly">Mod baca sahaja · Pentadbir tidak dibenarkan membalas.</div>');$('#back').onclick=goBack;if($('#showCode'))$('#showCode').onclick=()=>codeModal(t);if($('#forward'))$('#forward').onclick=()=>forwardModal(t);if(canReply){$('#message').oninput=()=>$('#send').disabled=!$('#message').value.trim();$('#compose').onsubmit=e=>{e.preventDefault();const text=$('#message').value.trim();if(!text||role==='pentadbir'||!allowed(t))return;t.messages.push({by:role,text});render();$('#message').focus()}}const box=$('#messages');box.scrollTop=box.scrollHeight}
function render(){renderSidebar();const t=current();if(t&&allowed(t))renderChat(t);else renderHome()}
function modal(content){$('#overlay').innerHTML='<div class="modal-cover"><section class="modal" role="dialog" aria-modal="true" aria-label="Tindakan perbualan">'+content+'</section></div>';const first=$('#overlay button, #overlay input, #overlay textarea');if(first)first.focus()}
function closeModal(){$('#overlay').innerHTML=''}
function codeModal(t){modal('<h2>Kunci perbualan anda.</h2><p>Simpan kod ini untuk membuka semula chat. Sesiapa yang memiliki kod ini boleh membaca perbualan.</p><div class="code" style="font-size:15px;overflow-wrap:anywhere">'+esc(t.code)+'</div><p><strong>Demo sahaja:</strong> kod hanya berfungsi sehingga halaman ini dimuat semula. Belum ada simpanan ke server.</p><div class="actions"><button class="secondary" id="copyCode">Salin kod</button><button class="primary" id="closeModal">Saya faham</button></div>');$('#closeModal').onclick=closeModal;$('#copyCode').onclick=async()=>{try{await navigator.clipboard.writeText(t.code);notify('Kod disalin.')}catch{notify('Salinan automatik tidak tersedia. Pilih dan salin kod secara manual.')}}}
function restoreModal(){modal('<h2>Buka semula chat</h2><p>Masukkan kod rahsia anda. Untuk cuba data contoh, guna DEMO-TIMBALAN atau DEMO-PENGARAH.</p><input id="restoreCode" aria-label="Kod rahsia" placeholder="Kod rahsia perbualan"><div class="actions"><button class="secondary" id="cancel">Batal</button><button class="primary" id="openCode">Buka chat</button></div>');$('#cancel').onclick=closeModal;$('#openCode').onclick=()=>{let t=threads.find(x=>x.code===$('#restoreCode').value.trim());if(!t){notify('Kod tidak ditemui dalam demo ini.');return}selected=t.id;closeModal();$('#shell').classList.add('chat-open');render()}}
function forwardModal(t){if(role!=='timbalan'||t.to!=='timbalan')return;modal('<h2>Majukan kepada Pengarah</h2><p>Seluruh perbualan dan mesej seterusnya akan boleh dibaca oleh Pengarah. Staf akan melihat status dimajukan.</p><label for="forwardNote" style="font-size:13px;font-weight:600">Nota dalaman ringkas</label><textarea id="forwardNote" maxlength="2000" placeholder="Konteks atau perkara untuk perhatian Pengarah…"></textarea><p>Nota hanya untuk Pengarah, Timbalan dan Pentadbir.</p><div class="actions"><button class="secondary" id="cancel">Batal</button><button class="primary" id="confirmForward">Sahkan & majukan</button></div>');$('#cancel').onclick=closeModal;$('#confirmForward').onclick=()=>{const note=$('#forwardNote').value.trim();if(!note){notify('Sila masukkan nota ringkas.');return}t.note=note;t.forwarded=true;closeModal();render();notify('Dimajukan dalam demo. Tukar ke paparan Pengarah untuk semak.')}}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;closeModal();document.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('active',x.dataset.role===role));if(!current()||!allowed(current()))selected=null;$('#shell').classList.remove('chat-open');render()});render();
</script></body></html>
